<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asia Tech & Economy Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Asia Tech & Economy Pulse</h1>
      <p class="text-slate-500 mt-1">Real-time curated intelligence from major regional outlets</p>
    </header>

    <!-- Controls -->
    <div class="flex flex-wrap gap-3 mb-6">
      <input type="text" id="searchInput" placeholder="Search keywords..." 
             class="px-4 py-2 border border-slate-300 rounded-lg text-sm flex-1 min-w-[200px] focus:outline-blue-500">
      
      <select id="categoryFilter" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
        <option value="ALL">All Categories</option>
        <option value="Technology">Technology</option>
        <option value="Economy">Economy</option>
      </select>

      <select id="regionFilter" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
        <option value="ALL">All Regions</option>
        <option value="Southeast Asia">Southeast Asia</option>
        <option value="East Asia">East Asia</option>
        <option value="China/East Asia">China/East Asia</option>
      </select>
    </div>

    <!-- News List -->
    <div id="newsContainer" class="space-y-3">
      <div class="p-8 text-center text-slate-400">Loading feeds...</div>
    </div>
  </div>

  <script>
    let allNews = [];

    async function loadNews() {
      try {
        const res = await fetch('data/news.json?t=' + Date.now());
        allNews = await res.json();
        render();
      } catch (err) {
        document.getElementById('newsContainer').innerHTML = 
          '<p class="text-red-500">Error loading data. Run the scraper first.</p>';
      }
    }

    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const reg = document.getElementById('regionFilter').value;

      const filtered = allNews.filter(item => {
        const matchSearch = item.title.toLowerCase().includes(search);
        const matchCat = cat === 'ALL' || item.category === cat;
        const matchReg = reg === 'ALL' || item.region === reg;
        return matchSearch && matchCat && matchReg;
      });

      const container = document.getElementById('newsContainer');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400">No news found</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <article class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 transition">
          <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider mb-1.5">
            <span class="text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${item.category}</span>
            <span class="text-slate-400">•</span>
            <span class="text-slate-600">${item.source}</span>
            <span class="text-slate-400">•</span>
            <span class="text-slate-400 font-normal">${item.region}</span>
          </div>
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
             class="text-base font-medium text-slate-900 hover:text-blue-600 block leading-snug">
            ${item.title}
          </a>
          <span class="text-xs text-slate-400 mt-2 block">${item.published_at}</span>
        </article>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('categoryFilter').addEventListener('change', render);
    document.getElementById('regionFilter').addEventListener('change', render);

    loadNews();
  </script>
</body>
</html>
